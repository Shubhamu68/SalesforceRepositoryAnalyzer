name: Aggregate Parser Compatibility Spike
on:
  push:
    branches: [feature/soql-aggregate-expression-analysis]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install parser for isolated evaluation
        run: npm install --no-save --package-lock=false @jetstreamapp/soql-parser-js@8.1.3
      - name: Evaluate SOQL syntax compatibility
        run: node scripts/aggregate-parser-compatibility.mjs
      - name: Record exact dependency metadata
        run: npm view @jetstreamapp/soql-parser-js@8.1.3 dist.integrity dist.tarball engines license dependencies --json
