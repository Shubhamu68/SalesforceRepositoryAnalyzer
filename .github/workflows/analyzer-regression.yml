name: Salesforce Analyzer Regression
on:
  push:
    branches:
      - main
      - chore/repository-professionalization
      - feature/nested-soql-relationship-resolution
      - fix/configurable-report-output
      - fix/excel-only-soql-reports
      - feature/repository-setup-and-org-credential-guards
      - feature/org-fallback-all-access-permissions
      - fix/platform-event-fls-and-managed-ps-warnings
      - feature/ui-messaging-cleanup
      - feature/soql-aggregate-expression-analysis
      - fix/apex-soql-bind-expression-normalization
      - fix/issue-19-field-access-evidence-status
      - feature/compound-field-access-verification
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Backend TypeScript compilation
        run: npm run build
      - name: All regression tests
        run: npm run test:all
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend production build
        working-directory: web
        run: npm run build
