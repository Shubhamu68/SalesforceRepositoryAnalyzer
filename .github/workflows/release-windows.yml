name: Publish Windows Portable Release

# A Release is created ONLY by deliberately pushing a version tag after UAT.
# Normal main merges, pull requests, and manual Windows builds cannot publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate approved main version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require semver tag, package version and main ancestry
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH or prerelease."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "${TAG_NAME#v}" != "$package_version" ]]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $package_version"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tag does not point to a commit on main."
            exit 1
          fi
          echo "Validated $TAG_NAME at $GITHUB_SHA on main."

  build-portable:
    name: Build and verify portable ZIP
    needs: validate-tag
    uses: ./.github/workflows/windows-portable.yml
    permissions:
      contents: read

  publish-release:
    name: Publish versioned GitHub Release
    needs: [validate-tag, build-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SalesforceRepositoryAnalyzer-Windows-Portable
          path: release
      - name: Validate release ZIP and exclude secrets
        shell: bash
        run: |
          set -euo pipefail
          zip="release/SalesforceRepositoryAnalyzer-Windows-Portable.zip"
          test -s "$zip"
          unzip -Z1 "$zip" | grep -Fq 'SalesforceRepositoryAnalyzer/Start Analyzer.cmd'
          unzip -Z1 "$zip" | grep -Fq 'SalesforceRepositoryAnalyzer/runtime/node.exe'
          if unzip -Z1 "$zip" | grep -Eq '(^|/)\.env$'; then
            echo "::error::Release ZIP contains a credential-bearing .env file."
            exit 1
          fi
      - name: Create SHA256 checksum
        shell: bash
        run: |
          cd release
          sha256sum SalesforceRepositoryAnalyzer-Windows-Portable.zip > SHA256SUMS.txt
      - name: Create GitHub Release (never overwrite existing release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::A release already exists for $TAG_NAME; refusing to replace it."
            exit 1
          fi
          args=()
          if [[ "$TAG_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            release/SalesforceRepositoryAnalyzer-Windows-Portable.zip \
            release/SHA256SUMS.txt \
            --verify-tag \
            --title "Salesforce Repository Analyzer $TAG_NAME" \
            --generate-notes \
            "${args[@]}"
