<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Starting Salesforce Repository Analyzer</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI",Arial,sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:#f5f7fb; color:#122640; }
    main { text-align:center; width:min(480px,85vw); }
    .mark { width:54px; height:54px; background:#2864e7; border-radius:15px;
      margin:0 auto 26px; display:grid; place-items:center; color:white; font-size:25px;
      font-weight:700; }
    h1 { font-size:23px; margin:0 0 12px; font-weight:700; }
    p { font-size:14px; color:#596f8d; margin:0; line-height:1.6; }
    .bar { width:220px; height:4px; margin:25px auto 0; overflow:hidden;
      background:#dbe5f6; border-radius:9px; }
    .bar::after { content:""; display:block; height:100%; width:45%; background:#2864e7;
      border-radius:9px; animation:slide 1.3s ease-in-out infinite alternate; }
    @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(330%); } }
    @media (prefers-reduced-motion:reduce) { .bar::after { animation:none; width:100%; } }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">S</div>
    <h1>Salesforce Repository Analyzer</h1>
    <p>Starting your local workspace…</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
</body>
</html>
